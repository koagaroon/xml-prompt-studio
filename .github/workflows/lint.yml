# Lint safety net.
# Runs on every push and PR. Mirrors `npm run lint` locally:
#   - ESLint (TypeScript / JSX)
#   - Stylelint (CSS)
#   - rustfmt --check (Rust formatting)
#   - cargo clippy -D warnings (Rust lints)
# Splits JS/CSS and Rust into parallel jobs so a failure in one doesn't
# block the other's signal, and the Rust job's slow compile doesn't
# bottleneck the fast JS/CSS feedback.

name: Lint

on:
  push:
  pull_request:

jobs:
  js-css:
    name: ESLint + Stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm deps
        run: npm ci

      - name: ESLint
        run: npm run lint:js

      - name: Stylelint
        run: npm run lint:css

  rust:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri 2 on Linux pulls in webkit2gtk-4.1 + GTK3 deps for the webview
      # crates that get type-checked during clippy. Without these, cargo
      # clippy fails on missing system libraries even though we never run
      # the actual app on the runner. Keep this list in sync with Tauri's
      # Linux prerequisites docs.
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
