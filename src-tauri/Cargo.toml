[package]
name = "xml-prompt-studio"
version = "0.1.0"
description = "A lightweight XML prompt authoring desktop app"
authors = ["koagaroon"]
edition = "2021"

[lib]
name = "xml_prompt_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Tauri major upgrade checklist (only triggers when WE choose to bump from
# `^2` to `^3`; SemVer pin prevents silent jumps):
#   1. Audit `tauri = { version, features }` below — list ONLY the features
#      the app actually uses and add `default-features = false`. Tauri 2's
#      defaults pull a plugin set we never touch; trimming shrinks the
#      attack surface.
#   2. Re-check `src-tauri/tauri.conf.json` CSP `connect-src` — currently
#      `'self' ipc: http://ipc.localhost https://ipc.localhost`; the IPC
#      scheme set can change across Tauri majors. Mismatch silently
#      breaks the IPC bridge.
[dependencies]
# default-features = false drops `image-data` (we only ever set text) —
# unused dependency surface. `wayland-data-control` is NOT in arboard's
# defaults; enabling it gives native Wayland clipboard support on Linux
# (without it arboard falls back to X11/XWayland only). The dep it pulls
# (wl-clipboard-rs) is target-gated to Linux in arboard itself.
arboard = { version = "3.6.1", default-features = false, features = [
    "wayland-data-control",
] }
tauri = { version = "2", features = [] }
