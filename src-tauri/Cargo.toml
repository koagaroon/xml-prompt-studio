[package]
name = "xml-prompt-studio"
# Single source of truth for the app version. tauri.conf.json deliberately
# omits `version` so Tauri falls back to this value (documented Tauri 2
# behavior) — do NOT re-add a copy there. package.json's version is npm
# boilerplate for the private workspace, not the app version.
version = "0.1.2"
description = "A lightweight XML prompt authoring desktop app"
authors = ["koagaroon"]
license = "MIT"
repository = "https://github.com/koagaroon/xml-prompt-studio"
edition = "2021"
# Minimum supported by the locked Tauri dependency graph. CI validates this
# floor separately from the pinned development toolchain.
rust-version = "1.88"

[lib]
name = "xml_prompt_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

# Tauri major upgrade checklist (only triggers when WE choose to bump from
# `^2` to `^3`; SemVer pin prevents silent jumps):
#   1. Re-audit `tauri = { version, features }` below and its default-feature
#      behavior. Disable defaults only after confirming that the desktop
#      runtime and production build retain the functionality they need.
#   2. Re-check `src-tauri/tauri.conf.json` CSP `connect-src` — currently
#      `'self' ipc: http://ipc.localhost https://ipc.localhost`; the IPC
#      scheme set can change across Tauri majors. Mismatch silently
#      breaks the IPC bridge.
[dependencies]
# default-features = false drops `image-data` (we only ever set text) —
# unused dependency surface. `wayland-data-control` is NOT in arboard's
# defaults; enabling it gives native Wayland clipboard support on Linux
# (without it arboard falls back to X11/XWayland only). The dep it pulls
# (wl-clipboard-rs) is target-gated to Linux in arboard itself.
arboard = { version = "3.6.1", default-features = false, features = [
    "wayland-data-control",
] }
tauri = { version = "2.11.5", features = [] }
